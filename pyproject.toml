[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mall-seg"
version = "1.0.0"
description = "Production Mall Customer Segmentation system with privacy-first feature engineering, multi-algorithm clustering, bootstrap stability gating, GMM uncertainty scoring, PSI drift monitoring, FastAPI, and Streamlit."
requires-python = ">=3.12"
dependencies = [
  "scikit-learn>=1.9.0",
  "scipy>=1.14.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "pandera>=0.30.0",
  "mlflow>=3.18.0",
  "sqlalchemy>=2.0.0",
  "fastapi>=0.165.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "streamlit>=1.40.0",
  "matplotlib>=3.9.0",
  "plotly>=5.24.0",
  "pyyaml>=6.0.0",
  "joblib>=1.4.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
